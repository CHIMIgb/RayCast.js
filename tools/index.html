<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RayCast.js — Sprite Slicer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', monospace;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: #16213e;
      border-bottom: 2px solid #0f3460;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 {
      font-size: 16px;
      color: #e94560;
      letter-spacing: 2px;
    }
    header .subtitle {
      font-size: 11px;
      color: #888;
    }
    header a {
      margin-left: auto;
      color: #0f3460;
      text-decoration: none;
      font-size: 11px;
    }
    header a:hover { color: #e94560; }

    /* ── LAYOUT ── */
    .app {
      display: grid;
      grid-template-columns: 300px 1fr;
      grid-template-rows: 1fr 200px;
      height: calc(100vh - 48px);
    }

    /* ── SIDEBAR ── */
    .sidebar {
      grid-row: 1 / 3;
      background: #16213e;
      border-right: 2px solid #0f3460;
      overflow-y: auto;
      padding: 12px;
    }

    .panel {
      margin-bottom: 16px;
    }
    .panel-title {
      font-size: 11px;
      color: #e94560;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #0f3460;
    }

    /* ── DROP ZONE ── */
    .drop-zone {
      border: 2px dashed #0f3460;
      border-radius: 8px;
      padding: 30px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #e94560;
      background: rgba(233, 69, 96, 0.1);
    }
    .drop-zone .icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .drop-zone .text {
      font-size: 11px;
      color: #888;
    }
    .drop-zone input { display: none; }

    /* ── CONTROLS ── */
    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .control-row label {
      font-size: 11px;
      color: #aaa;
      min-width: 70px;
    }
    .control-row input[type="number"],
    .control-row input[type="range"],
    .control-row select {
      flex: 1;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      color: #e0e0e0;
      padding: 4px 6px;
      font-size: 11px;
      font-family: inherit;
      border-radius: 3px;
    }
    .control-row input[type="checkbox"] {
      accent-color: #e94560;
    }

    .btn {
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #e94560;
      padding: 6px 12px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #e94560;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .btn-row .btn { flex: 1; }

    /* ── MAIN CANVAS ── */
    .main-view {
      background: #0d1117;
      overflow: auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .main-view canvas {
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
    }

    /* ── GRID OVERLAY ── */
    .grid-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }

    /* ── FRAMES PANEL (bottom) ── */
    .frames-panel {
      grid-column: 2;
      background: #16213e;
      border-top: 2px solid #0f3460;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      align-items: flex-start;
      align-content: flex-start;
      flex-wrap: nowrap;
    }

    .frame-thumb {
      flex-shrink: 0;
      width: 80px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 4px;
      padding: 4px;
      transition: border-color 0.15s;
    }
    .frame-thumb:hover {
      border-color: #0f3460;
    }
    .frame-thumb.selected {
      border-color: #e94560;
    }
    .frame-thumb canvas {
      width: 72px;
      height: auto;
      max-height: 120px;
      image-rendering: pixelated;
      background: repeating-conic-gradient(#2a2a3e 0% 25%, #1a1a2e 0% 50%) 50% / 12px 12px;
      display: block;
      margin: 0 auto;
    }
    .frame-thumb .frame-label {
      font-size: 9px;
      color: #888;
      margin-top: 3px;
    }

    /* ── STATUS BAR ── */
    .status-bar {
      background: #0f3460;
      padding: 4px 12px;
      font-size: 10px;
      color: #aaa;
      display: flex;
      gap: 16px;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
    }

    /* ── LOADING OVERLAY ── */
    .loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-size: 14px;
      color: #e94560;
      display: none;
    }
    .loading.active { display: flex; }

    /* ── ZOOM ── */
    .zoom-controls {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      gap: 4px;
      z-index: 5;
    }
    .zoom-controls .btn {
      width: 28px;
      height: 28px;
      padding: 0;
      text-align: center;
      font-size: 14px;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <h1>RAYCAST.JS</h1>
  <span class="subtitle">SPRITE SLICER</span>
  <a href="../index.html">← Volver al juego</a>
</header>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <!-- Carga -->
    <div class="panel">
      <div class="panel-title">Sprite Sheet</div>
      <div class="drop-zone" id="dropZone">
        <div class="icon">📁</div>
        <div class="text">Arrastra un PNG aquí<br>o haz click para seleccionar</div>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif">
      </div>
    </div>

    <!-- Configuración de detección -->
    <div class="panel" id="configPanel" style="display:none">
      <div class="panel-title">Detección de Grilla</div>

      <div class="control-row">
        <label>Tolerancia</label>
        <input type="number" id="tolerance" value="1" min="0" max="50">
      </div>
      <div class="control-row">
        <label>Min frame</label>
        <input type="number" id="minFrame" value="8" min="1" max="100">
      </div>
      <div class="control-row">
        <label>Trim</label>
        <input type="checkbox" id="trimFrames" checked>
      </div>

      <div class="panel-title" style="margin-top:12px">Background Removal</div>

      <div class="control-row">
        <label>Método</label>
        <select id="bgMethod">
          <option value="floodfill">Flood Fill (bordes)</option>
          <option value="colorkey">Color Key (todo)</option>
          <option value="none">Ninguno</option>
        </select>
      </div>
      <div class="control-row">
        <label>Bg Tolerance</label>
        <input type="range" id="bgTolerance" min="1" max="100" value="10">
        <span id="bgToleranceVal" style="font-size:10px;min-width:24px">10</span>
      </div>
      <div class="control-row">
        <label>Padding</label>
        <input type="number" id="padding" value="0" min="0" max="20">
      </div>

      <div class="panel-title" style="margin-top:12px">Grid Manual (override)</div>
      <div class="control-row">
        <label>Cols</label>
        <input type="number" id="manualCols" value="0" min="0" max="50" placeholder="0=auto">
      </div>
      <div class="control-row">
        <label>Rows</label>
        <input type="number" id="manualRows" value="0" min="0" max="50" placeholder="0=auto">
      </div>

      <div class="btn-row">
        <button class="btn" id="btnSlice">CORTAR</button>
      </div>
      <div class="btn-row">
        <button class="btn" id="btnExportAll">EXPORTAR TODO</button>
        <button class="btn" id="btnExportJSON">JSON</button>
      </div>
    </div>

    <!-- Info -->
    <div class="panel" id="infoPanel" style="display:none">
      <div class="panel-title">Información</div>
      <div id="infoContent" style="font-size:10px;line-height:1.6;color:#aaa"></div>
    </div>
  </div>

  <!-- MAIN VIEW -->
  <div class="main-view" id="mainView">
    <canvas id="mainCanvas"></canvas>
    <div class="zoom-controls">
      <button class="btn" id="zoomIn">+</button>
      <button class="btn" id="zoomOut">-</button>
      <button class="btn" id="zoomFit">◻</button>
    </div>
  </div>

  <!-- FRAMES PANEL -->
  <div class="frames-panel" id="framesPanel">
    <!-- Frames se insertan dinámicamente -->
  </div>
</div>

<div class="status-bar">
  <span id="statusLeft">Esperando sprite sheet...</span>
  <span id="statusRight"></span>
</div>

<div class="loading" id="loading">Procesando...</div>

<script src="/tools/sprite-slicer.js"></script>
<script>
// ═══════════════════════════════════════════════
//  UI CONTROLLER
// ═══════════════════════════════════════════════

const slicer = new SpriteSlicer();
let currentResult = null;
let selectedFrame = null;
let zoomLevel = 1;
let originalImageData = null;

// ── Elementos DOM ──
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const configPanel = document.getElementById('configPanel');
const infoPanel = document.getElementById('infoPanel');
const infoContent = document.getElementById('infoContent');
const mainCanvas = document.getElementById('mainCanvas');
const mainCtx = mainCanvas.getContext('2d');
const framesPanel = document.getElementById('framesPanel');
const loading = document.getElementById('loading');
const statusLeft = document.getElementById('statusLeft');
const statusRight = document.getElementById('statusRight');
const bgToleranceSlider = document.getElementById('bgTolerance');
const bgToleranceVal = document.getElementById('bgToleranceVal');

// ── Eventos de carga ──
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) processFile(fileInput.files[0]);
});

// ── Slider bg tolerance ──
bgToleranceSlider.addEventListener('input', () => {
  bgToleranceVal.textContent = bgToleranceSlider.value;
});

// ── Botones ──
document.getElementById('btnSlice').addEventListener('click', runSlice);
document.getElementById('btnExportAll').addEventListener('click', exportAll);
document.getElementById('btnExportJSON').addEventListener('click', exportJSON);
document.getElementById('zoomIn').addEventListener('click', () => setZoom(zoomLevel * 1.5));
document.getElementById('zoomOut').addEventListener('click', () => setZoom(zoomLevel / 1.5));
document.getElementById('zoomFit').addEventListener('click', zoomFit);

// ── Procesar archivo ──
async function processFile(file) {
  loading.classList.add('active');
  statusLeft.textContent = `Cargando ${file.name}...`;

  try {
    const loaded = await slicer.loadFile(file);
    originalImageData = loaded.imageData;

    // Mostrar imagen original
    mainCanvas.width = loaded.width;
    mainCanvas.height = loaded.height;
    mainCtx.putImageData(loaded.imageData, 0, 0);
    zoomFit();

    // Mostrar info
    configPanel.style.display = '';
    infoPanel.style.display = '';
    infoContent.innerHTML = `
      <b>Archivo:</b> ${file.name}<br>
      <b>Tamaño:</b> ${loaded.width} × ${loaded.height} px<br>
      <b>Color de fondo:</b> rgb(${slicer._detectBgColor(loaded.imageData).r}, ${slicer._detectBgColor(loaded.imageData).g}, ${slicer._detectBgColor(loaded.imageData).b})
    `;

    statusLeft.textContent = `${file.name} — ${loaded.width}×${loaded.height} — Listo para cortar`;

    // Auto-cortar
    await runSlice();
  } catch (err) {
    statusLeft.textContent = `Error: ${err.message}`;
    console.error(err);
  }

  loading.classList.remove('active');
}

// ── Ejecutar corte ──
async function runSlice() {
  if (!originalImageData) return;

  loading.classList.add('active');
  statusLeft.textContent = 'Detectando frames...';

  const tolerance = parseInt(document.getElementById('tolerance').value) || 1;
  const minFrame = parseInt(document.getElementById('minFrame').value) || 8;
  const trim = document.getElementById('trimFrames').checked;
  const bgMethod = document.getElementById('bgMethod').value;
  const bgTol = parseInt(bgToleranceSlider.value) || 30;
  const padding = parseInt(document.getElementById('padding').value) || 0;
  const manualCols = parseInt(document.getElementById('manualCols').value) || 0;
  const manualRows = parseInt(document.getElementById('manualRows').value) || 0;

  const opts = {
    tolerance,
    minFrameSize: minFrame,
    trim,
    removeBg: bgMethod !== 'none',
    bgMethod,
    bgTolerance: bgTol,
    padding
  };

  if (manualCols > 0 && manualRows > 0) {
    opts.manualGrid = { cols: manualCols, rows: manualRows };
  }

  try {
    currentResult = await slicer.autoSlice(null, opts);

    // Refrescar la imagen original en el canvas principal
    mainCtx.putImageData(originalImageData, 0, 0);

    // Dibujar overlay de grilla
    drawGridOverlay(currentResult.grid);

    // Mostrar frames en el panel inferior
    renderFramesPanel(currentResult.frames);

    // Info actualizada
    infoContent.innerHTML = `
      <b>Imagen:</b> ${originalImageData.width} × ${originalImageData.height}<br>
      <b>Grilla:</b> ${currentResult.grid.cols} cols × ${currentResult.grid.rows} rows<br>
      <b>Celdas totales:</b> ${currentResult.grid.totalCells}<br>
      <b>Frames extraídos:</b> ${currentResult.grid.extractedFrames}<br>
      <b>Fondo:</b> rgb(${currentResult.metadata.bgColor.r}, ${currentResult.metadata.bgColor.g}, ${currentResult.metadata.bgColor.b})
    `;

    statusLeft.textContent = `${currentResult.grid.extractedFrames} frames detectados — Click en un frame para previsualizar`;
  } catch (err) {
    statusLeft.textContent = `Error: ${err.message}`;
    console.error(err);
  }

  loading.classList.remove('active');
}

// ── Dibujar overlay de grilla ──
function drawGridOverlay(grid) {
  // Redibujar imagen original
  mainCtx.putImageData(originalImageData, 0, 0);

  mainCtx.strokeStyle = 'rgba(233, 69, 96, 0.6)';
  mainCtx.lineWidth = 1;

  // Líneas horizontales
  for (const row of grid.rowBlocks) {
    mainCtx.beginPath();
    mainCtx.moveTo(0, row.start);
    mainCtx.lineTo(originalImageData.width, row.start);
    mainCtx.stroke();
    mainCtx.beginPath();
    mainCtx.moveTo(0, row.end + 1);
    mainCtx.lineTo(originalImageData.width, row.end + 1);
    mainCtx.stroke();
  }

  // Líneas verticales
  for (const col of grid.colBlocks) {
    mainCtx.beginPath();
    mainCtx.moveTo(col.start, 0);
    mainCtx.lineTo(col.start, originalImageData.height);
    mainCtx.stroke();
    mainCtx.beginPath();
    mainCtx.moveTo(col.end + 1, 0);
    mainCtx.lineTo(col.end + 1, originalImageData.height);
    mainCtx.stroke();
  }
}

// ── Renderizar panel de frames ──
function renderFramesPanel(frames) {
  framesPanel.innerHTML = '';

  frames.forEach((frame, i) => {
    const div = document.createElement('div');
    div.className = 'frame-thumb';
    div.dataset.index = i;

    const canvas = document.createElement('canvas');
    canvas.width = frame.canvas.width;
    canvas.height = frame.canvas.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(frame.canvas, 0, 0);

    const label = document.createElement('div');
    label.className = 'frame-label';
    label.textContent = `#${i} ${frame.canvas.width}×${frame.canvas.height}`;

    div.appendChild(canvas);
    div.appendChild(label);

    div.addEventListener('click', () => selectFrame(i));
    framesPanel.appendChild(div);
  });
}

// ── Seleccionar frame ──
function selectFrame(index) {
  if (!currentResult) return;

  selectedFrame = index;
  const frame = currentResult.frames[index];

  // Highlight en el panel
  framesPanel.querySelectorAll('.frame-thumb').forEach((el, i) => {
    el.classList.toggle('selected', i === index);
  });

  // Mostrar frame en el canvas principal (escalado)
  const canvas = frame.canvas;
  mainCanvas.width = canvas.width;
  mainCanvas.height = canvas.height;
  mainCtx.clearRect(0, 0, canvas.width, canvas.height);

  // Fondo de tablero de ajedrez para ver transparencia
  const checkSize = 8;
  for (let y = 0; y < canvas.height; y += checkSize) {
    for (let x = 0; x < canvas.width; x += checkSize) {
      const isLight = ((x / checkSize + y / checkSize) % 2) === 0;
      mainCtx.fillStyle = isLight ? '#3a3a4e' : '#2a2a3e';
      mainCtx.fillRect(x, y, checkSize, checkSize);
    }
  }

  mainCtx.drawImage(canvas, 0, 0);

  // Zoom fit al frame
  zoomFit();

  statusLeft.textContent = `Frame #${index} — ${canvas.width}×${canvas.height} px`;
  statusRight.textContent = `Bounds: (${frame.bounds.x}, ${frame.bounds.y}) ${frame.bounds.w}×${frame.bounds.h}`;
}

// ── Zoom ──
function setZoom(level) {
  zoomLevel = Math.max(0.1, Math.min(10, level));
  mainCanvas.style.width = (mainCanvas.width * zoomLevel) + 'px';
  mainCanvas.style.height = (mainCanvas.height * zoomLevel) + 'px';
}

function zoomFit() {
  const view = document.getElementById('mainView');
  const maxW = view.clientWidth - 40;
  const maxH = view.clientHeight - 40;
  const scaleX = maxW / mainCanvas.width;
  const scaleY = maxH / mainCanvas.height;
  setZoom(Math.min(scaleX, scaleY, 4));
}

// ── Exportar ──
function exportAll() {
  if (!currentResult) return;
  slicer.downloadAllFrames(currentResult.frames, 'frame');
}

function exportJSON() {
  if (!currentResult) return;
  const json = slicer.generateJSON(currentResult.frames, 'sprite');
  const blob = new Blob([JSON.stringify(json, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sprite.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', (e) => {
  if (!currentResult) return;
  const frames = currentResult.frames;

  if (e.key === 'ArrowRight' || e.key === 'd') {
    e.preventDefault();
    const next = selectedFrame !== null ? Math.min(selectedFrame + 1, frames.length - 1) : 0;
    selectFrame(next);
  }
  if (e.key === 'ArrowLeft' || e.key === 'a') {
    e.preventDefault();
    const prev = selectedFrame !== null ? Math.max(selectedFrame - 1, 0) : 0;
    selectFrame(prev);
  }
  if (e.key === '1') document.getElementById('bgMethod').value = 'floodfill';
  if (e.key === '2') document.getElementById('bgMethod').value = 'colorkey';
  if (e.key === '3') document.getElementById('bgMethod').value = 'none';
});
</script>
</body>
</html>
